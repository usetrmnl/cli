version: 2
project_name: trmnl
before:
  hooks:
    # Each release carries the licenses of the modules compiled into it.
    - go run github.com/google/go-licenses/v2@v2.0.1 save ./cmd/trmnl --save_path=third_party_licenses --ignore github.com/usetrmnl/cli --force
builds:
  - main: ./cmd/trmnl
    binary: trmnl
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, third_party_licenses/**/*]
    format_overrides:
      - goos: windows
        formats: [zip]
homebrew_casks:
  - name: trmnl
    description: The TRMNL API as a command line
    homepage: https://github.com/usetrmnl/cli
    license: MIT
    repository:
      owner: usetrmnl
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        # The binary is not signed by Apple, so Gatekeeper would refuse the first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/trmnl"]
          end
