version: 2
builds:
  - main: ./cmd/trmnl
    binary: trmnl
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
homebrew_casks:
  - name: trmnl
    description: The TRMNL API as a command line
    homepage: https://github.com/usetrmnl/cli
    license: MIT
    repository:
      owner: usetrmnl
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        # The binary is not signed by Apple, so Gatekeeper would refuse the first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/trmnl"]
          end
